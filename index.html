async function _fetch(){try{const r=await fetch(_burl+'/latest',{headers:{'X-Master-Key':_key}});if(!r.ok)throw new Error(r.status);const j=await r.json();_cache=j.record||{messages:[],pending:[]};}catch(e){messageList.innerHTML='<div class="empty-msg">留言加载失败，请检查网络或JSONBin配置</div>';_cache={messages:[],pending:[]};}}
async function _save(){if(_bin==='YOUR_BIN_ID')return;try{await fetch(_burl,{method:'PUT',headers:{'X-Master-Key':_key,'Content-Type':'application/json'},body:JSON.stringify(_cache)});}catch(e){_tip('保存失败，请检查网络');}}
function _rm(){if(!_a){const msgs=_cache.messages;if(msgs.length===0){messageList.innerHTML='<div class="empty-msg">还没有人留下痕迹...</div>';return;}messageList.innerHTML=msgs.map(m=>`<div class="message-item"><div class="msg-header"><div class="msg-avatar">${m.avatar}</div><div class="msg-info"><div class="msg-nick">${m.nick}</div><div class="msg-time">${m.time}</div></div></div><div class="msg-text">${m.text}</div></div>`).join('');}else{const all=[..._cache.pending.map(m=>({...m,isPending:true})),..._cache.messages];if(all.length===0){messageList.innerHTML='<div class="empty-msg">暂无留言</div>';return;}messageList.innerHTML=all.map((m,i)=>`<div class="message-item"><div class="msg-header"><div class="msg-avatar">${m.avatar}</div><div class="msg-info"><div class="msg-nick">${m.nick}${m.isPending?'<span class="pending-badge">待审核</span>':''}</div><div class="msg-time">${m.time}</div></div></div><div class="msg-text">${m.text}</div>${m.isPending?`<div class="admin-controls"><button class="admin-btn approve" onclick="window._ap(${i})">通过</button><button class="admin-btn reject" onclick="window._rj(${i})">拒绝</button></div>`:''}</div>`).join('');}}
submitBtn.addEventListener('click',async()=>{const nick=nickInput.value.trim();const text=textInput.value.trim();if(!nick){_tip('请填写昵称');return;}if(!text){_tip('请写点什么吧');return;}const avatar=SYSTEM_AVATARS[Math.floor(Math.random()*SYSTEM_AVATARS.length)];const now=new Date();const time=`${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;_cache.pending.push({nick,text,avatar,time});await _save();nickInput.value='';textInput.value='';_tip('已投入树洞，等待审核');_rm();});
treeHole.querySelector('.tree-hole-icon').addEventListener('click',()=>{messagePanel.classList.add('open');_rm();});
document.addEventListener('keydown',e=>{if([123,112].includes(e.keyCode)||(e.ctrlKey&&e.shiftKey&&[73,74,67].includes(e.keyCode))||(e.ctrlKey&&e.keyCode===85)){e.preventDefault();e.stopPropagation();return;}if(e.altKey&&e.keyCode===115){e.preventDefault();return;}_k.push(e.keyCode);if(_k.length>10)_k.shift();const konami=[38,38,40,40,37,39,37,39,66,65];if(_k.length>=konami.length&&_k.slice(-konami.length).every((v,i)=>v===konami[i])){_k=[];if(!_a){const pwd=prompt('输入密码:');if(pwd){async function sha256(msg){const msgBuffer=new TextEncoder().encode(msg+_v);const hashBuffer=await crypto.subtle.digest('SHA-256',msgBuffer);const hashArray=Array.from(new Uint8Array(hashBuffer));const hashHex=hashArray.map(b=>b.toString(16).padStart(2,'0')).join('');return hashHex;}sha256(pwd).then(hash=>{if(hash===_h){_a=true;adminBadge.classList.add('show');_tip('已进入管理模式');_rm();}else{_tip('密码错误');}});}}else{_a=false;adminBadge.classList.remove('show');_tip('已退出管理模式');_rm();}}});
document.addEventListener('contextmenu',e=>e.preventDefault());
window._ap=async i=>{const msg=_cache.pending.splice(i,1)[0];_cache.messages.unshift(msg);await _save();_tip('已通过');_rm();};
window._rj=async i=>{_cache.pending.splice(i,1);await _save();_tip('已拒绝');_rm();};
function _tip(t){const d=document.createElement('div');d.className='tip';d.textContent=t;document.body.appendChild(d);setTimeout(()=>d.remove(),2000);}
quoteText.textContent=QUOTES[Math.floor(Math.random()*QUOTES.length)];
_fetch().then(()=>{_rm();});
})();
</script>
</body>
